# One BehaviorName and one trainer continue through all three MyRacer stages.
# Start:  mlagents-learn config/racer_curriculum.yaml --run-id=racer-curriculum-v1
# Resume: same command plus --resume; set MyRacer Manual Stage to the last stage
# before Play (Automatic Promotion may stay enabled). The C# rolling window restarts.
# IMPORTANT: Training.unity currently references SampleRacerAgent. Replace the
# agent SCRIPT with MyRacer in the editor before training; keep the car physics,
# continuous action count (2), BehaviorName (Racer), and all sensor settings.
# MyRacer initializes its vector size to 53 (default counts), retaining 3 stacks.
# Old 21-vector checkpoints are incompatible with this new observation contract.
# All active agents named Racer must have the same script / observation contract.
# For evaluation, select an AGENT-ROOT prefab containing MyRacer and the same
# sensors. The current evaluation prefab contains SampleRacerAgent; do not use
# the whole RaceCarTiger vehicle prefab as an agent prefab.
#
# Promotion: most recent 100 episodes, at least 50 samples, >=80% finishes;
# stage 2 additionally requires >=60% of ALL episodes to finish within target.
# Set these Inspector values consistently on agents sharing the Racer policy.
# Random track target = track length / 12 m/s + 3 s; fixed track = 60 s.
# Length alone does not normalize corner difficulty. Tune speed/rates using
# Curriculum/LapToTargetRatio together with FinishRate, never failed lap times.
behaviors:
  Racer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # At 0.08 s/decision, retain meaningful credit for a 60-100 s finish.
        gamma: 0.999
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 12000000
    time_horizon: 1000
    summary_freq: 20000

