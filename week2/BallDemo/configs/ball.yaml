behaviors:
  3DBall:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 12000
      learning_rate: 3.0e-4
      beta: 0.001   
      epsilon: 0.2    
      lambd: 0.95     
      num_epoch: 3  
    network_settings:
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99 
        strength: 1.0
    max_steps: 500000
environment_parameters:
  scale:
    sampler_type: uniform
    sampler_parameters: {min_value: 0.1, max_value: 2}